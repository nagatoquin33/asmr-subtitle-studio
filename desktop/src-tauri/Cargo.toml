[package]
name = "asmr-studio"
version.workspace = true
edition.workspace = true
description = "ASMR 字幕工作室（桌面版）"

[features]
bundled-tools = ["asmr-core/bundled-tools"]
whisper-vulkan = ["asmr-core/whisper-vulkan"]
whisper-cuda = ["asmr-core/whisper-cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
asmr-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "asmr-studio"
path = "src/main.rs"
