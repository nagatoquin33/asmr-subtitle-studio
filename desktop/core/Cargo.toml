[package]
name = "asmr-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "asmr-asr-vulkan"
path = "src/bin/asmr-asr-vulkan.rs"
required-features = ["whisper-vulkan"]

[[bin]]
name = "unpack-tools"
path = "src/bin/unpack-tools.rs"

[features]
# 内嵌 ffmpeg/ffprobe/yt-dlp（发布构建开启；开发构建跳过以加快链接）
bundled-tools = []
# 透传 whisper-rs GPU 后端（发布构建二选一启用；同时用于 ASR 元数据如实上报设备）
whisper-vulkan = ["whisper-rs/vulkan", "whisper-rs/raw-api"]
whisper-cuda = ["whisper-rs/cuda"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "default-tls"] }
futures-util = "0.3"
regex = "1"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
whisper-rs = "0.16"
zstd = "0.13"
