name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish as GitHub Release (uses version from tauri.conf.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows x64 Installer (CPU + Vulkan)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      ASMR_BUILD_ROOT: C:\a
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve latest Vulkan SDK version
        id: vk
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          if (-not $ver) { throw "Failed to resolve latest Vulkan SDK version" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Latest Vulkan SDK: $ver"

      - name: Cache Vulkan SDK
        id: vk-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-win-${{ steps.vk.outputs.version }}

      - name: Install Vulkan SDK (official LunarG silent installer)
        if: steps.vk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.vk.outputs.version }}"
          $installer = Join-Path $env:TEMP "vulkan_sdk.exe"
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe?Human=true"
          & $installer --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer exited with $LASTEXITCODE" }
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Verify Vulkan SDK & Locate VS vcvars64.bat
        shell: pwsh
        run: |
          $vkRoot = "C:\VulkanSDK"
          foreach ($rel in @("Bin\glslc.exe", "Include\vulkan\vulkan.h", "Lib\vulkan-1.lib")) {
            $full = Join-Path $vkRoot $rel
            if (-not (Test-Path $full)) {
              throw "Missing Vulkan SDK file: $full"
            }
          }
          "VULKAN_SDK=$vkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $vkRoot "Bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          "VS_VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VULKAN_SDK=$vkRoot"
          Write-Host "VS_VCVARS=$vcvars"
          & (Join-Path $vkRoot "Bin\glslc.exe") --version

      - name: Run asmr-core unit tests
        working-directory: desktop
        run: cargo test --locked -p asmr-core

      - name: Build unified NSIS installer
        shell: cmd
        run: desktop\build-release.bat

      - name: Collect installer and SHA256
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem "desktop/dist/installer/*_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer not found for version $version"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          $sumFile = Join-Path $installer.DirectoryName "SHA256SUMS.txt"
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $sumFile -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256_path=$sumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Built: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 2)) MiB)"
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: asmr-subtitle-studio-v${{ steps.collect.outputs.version }}-win-x64
          path: |
            ${{ steps.collect.outputs.installer_path }}
            ${{ steps.collect.outputs.sha256_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            "${{ github.ref_name }}"
          } else {
            "v${{ steps.collect.outputs.version }}"
          }
          $installer = "${{ steps.collect.outputs.installer_path }}"
          $shaFile = "${{ steps.collect.outputs.sha256_path }}"
          $notes = @"
          ## ASMR 字幕工作室 $tag

          - 统一 Windows x64 安装包（支持自选安装目录、覆盖升级保留作品库与模型）
          - 内置 CPU + 独立可复用 Vulkan GPU 转写组件（支持 NVIDIA / AMD / Intel Vulkan 显卡，无 Vulkan 自动回退 CPU）
          - 本地 ASMR 作品库（支持 RJ 编号识别、多编码 SRT/VTT/ASS/LRC 字幕、断点续播、睡眠定时与滚动台本）
          "@
          $exists = $true
          try { gh release view $tag > $null 2>&1 } catch { $exists = $false }
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if ($exists) {
            gh release upload $tag "$installer" "$shaFile" --clobber
          } else {
            gh release create $tag "$installer" "$shaFile" --title "ASMR 字幕工作室 $tag" --notes "$notes"
          }
