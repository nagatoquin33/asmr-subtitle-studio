name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend & Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JS syntax
        run: |
          node --check frontend/api.js
          node --check frontend/app.js
          node --check frontend/library.js
      - name: Validate Tauri JSON configs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.installer.conf.json','utf8'))"

  rust:
    name: Rust Core Tests & Tauri Check (Windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Run asmr-core tests
        working-directory: desktop
        run: cargo test --locked -p asmr-core
      - name: Check asmr-studio binary
        working-directory: desktop
        run: cargo check --locked -p asmr-studio
